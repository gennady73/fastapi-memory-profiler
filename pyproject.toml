[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-memory-profiler"
version = "0.1.0a1"
description = "A drop-in FastAPI router for real-time memory leak profiling."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "gennady73", email = "noname@example.com"}
]
dependencies = [
    "fastapi>=0.68.0",
    "psutil>=5.8.0",
    "pympler>=1.0.1",
    "objgraph>=3.5.0",
    "graphviz>=0.20.1"
]

